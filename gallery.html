<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="images/logo.png" type="image/x-icon" />
  <title>Private Client Gallery — Diana Obermeyer Photography</title>
  <style>
    :root {
      --bg-color: #FAF7F4;
      --card-bg: #FFFFFF;
      --text-main: #2C2C2C;
      --text-muted: #8A8278;
      --accent-gold: #B8976A;
      --border-color: rgba(44,44,44,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg-color); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; padding: 40px 20px; font-weight: 500; }
    .container { max-width: 1200px; margin: 0 auto; }
    
    header { text-align: center; margin-bottom: 50px; border-bottom: 1px solid var(--border-color); padding-bottom: 30px; }
    header h1 { font-family: Georgia, serif; font-size: 28px; font-weight: 500; letter-spacing: 3px; text-transform: uppercase; }
    header p { font-family: Georgia, serif; font-style: italic; font-size: 13px; letter-spacing: 4px; color: var(--accent-gold); text-transform: uppercase; margin-top: 6px; }

    /* Auth Password Gate */
    #authGate { max-width: 400px; margin: 100px auto; background: white; padding: 45px; border: 1px solid var(--border-color); text-align: left; }
    label { display: block; margin-bottom: 8px; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; }
    input { width: 100%; padding: 14px; margin-bottom: 20px; border: 1px solid var(--border-color); background: white; color: var(--text-main); font-size: 14px; }
    button { background: var(--text-main); color: white; border: none; padding: 15px 28px; width: 100%; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; font-size: 11px; transition: .2s ease; }
    button:hover { background: var(--accent-gold); }
    
    .msg { display: none; padding: 14px; margin-top: 18px; font-size: 13px; text-align: center; }
    .msg.error { display: block; background: #FCEAEA; color: #9C2A2A; }
    .msg.success { display: block; background: #EAF5EA; color: #2E662E; }
    .msg.loading { display: block; background: #F3EEE6; color: #57452E; }

    /* Protected Gallery Content View */
    #galleryView { display: none; }
    .gallery-downloads { text-align: center; margin: 25px 0; }
    .gallery-downloads button { width: auto; margin: 6px; }
    button:disabled { opacity: .55; cursor: wait; }
    #downloadStatus { margin-top: 12px; font-size: 14px; overflow-wrap: anywhere; }
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; margin-top: 40px; }
    
    .gallery-item { position: relative; overflow: hidden; background: #eaeaea; aspect-ratio: 3/2; cursor: pointer; border: 1px solid var(--border-color); }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease, opacity 0.5s ease; opacity: 0; }
    .gallery-item:hover img { transform: scale(1.03); }

    /* Lightbox Modal viewer */
    .lightbox { position: fixed; inset: 0; background: rgba(26, 26, 26, 0.95); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .lightbox.active { display: flex; }
    .lightbox-img { max-width: 90vw; max-height: 85vh; object-fit: contain; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .lightbox-close { position: absolute; top: 25px; right: 30px; color: #fff; font-size: 35px; cursor: pointer; background: transparent; border: none; width: auto; padding: 0; }
    .lightbox-close:hover { color: var(--accent-gold); }

    @media(max-width: 768px) {
      body { padding: 20px 10px; }
      .gallery-grid { grid-template-columns: 1fr; gap: 15px; }
    }
  </style>
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
</head>
<body>

<div class="container">
  <header>
    <h1 id="galleryTitle">Private Collection</h1>
    <p id="gallerySubtitle">Diana Obermeyer Photography</p>
  </header>

  <!-- Password Entry Gate -->
  <div id="authGate">
    <label for="galleryPass">Enter Access Password</label>
    <input type="password" id="galleryPass" placeholder="••••••••••••">
    <button id="unlockBtn">View Protected Gallery</button>
    <div id="gateMsg" class="msg"></div>
  </div>

  <!-- Protected Visual Assets View -->
  <div id="galleryView">
    <div id="photoLoadStatus" class="msg" role="status" aria-live="polite" aria-atomic="true"></div>
    <button id="retryPhotosBtn" type="button" hidden>Retry photos that did not load</button>
    <div class="gallery-downloads">
      <button id="downloadAllBtn" type="button" disabled>Download all photos</button>
      <button id="cancelDownloadBtn" type="button" hidden>Cancel download</button>
      <p>Save the complete collection as a ZIP, in original quality. On phones and some browsers it arrives in several smaller parts.</p>
      <p id="downloadStatus" class="msg" role="status" aria-live="polite" aria-atomic="true" tabindex="-1"></p>
      <a id="saveZipLink" hidden>Save your ZIP</a>
      <button id="nextPartBtn" type="button" hidden></button>
    </div>
    <div class="gallery-grid" id="photoGrid"></div>
  </div>
</div>

<!-- Lightbox Modal Viewer -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
  <img class="lightbox-img" id="lightboxImg" src="" alt="Full size print review asset">
</div>

<script src="vendor/zip-core-2.24.0.min.js"></script>
<script src="gallery-download.js?v=20261021-parallel-ranges"></script>
<script>
  // ⚠️ IMPORTANT: Replace this URL with the EXACT same URL used in your admin.html
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxGN_ZBZvWYh16bD8NF0vKJvmt7cGy_Ko8aSSJgr58K1RyxZQS4mv_Fd9D4DNbxyXx8/exec";

  const urlParams = new URLSearchParams(window.location.search);
  const galleryId = urlParams.get('id');
  let galleryPassword = '';
  let galleryImages = [];
  let downloadController = null;
  let readyZipUrl = null;
  let resumePart = 1; // after a failed multi-part download, restart from this part

  document.addEventListener("DOMContentLoaded", () => {
    if (!galleryId) {
      document.getElementById("galleryPass").disabled = true;
      document.getElementById("unlockBtn").disabled = true;
      showMsg("error", "Invalid or missing gallery link. Please check the URL provided by your photographer.");
      return;
    }
    document.getElementById("unlockBtn").addEventListener("click", unlockGallery);
    document.getElementById('downloadAllBtn').addEventListener('click', downloadAllPhotos);
    document.getElementById('cancelDownloadBtn').addEventListener('click', () => downloadController?.abort());
    document.getElementById("galleryPass").addEventListener("keypress", (e) => {
      if (e.key === "Enter") unlockGallery();
    });
  });

  async function unlockGallery() {
    if (document.getElementById("unlockBtn").disabled) return;
    const password = document.getElementById("galleryPass").value.trim();
    if (!password) {
      showMsg("error", "Password cannot be blank.");
      return;
    }

    showMsg("success", "Verifying credentials...");
    const btn = document.getElementById("unlockBtn");
    btn.disabled = true;

    try {
      const response = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        mode: "cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({
          action: "get_gallery",
          gallery_id: galleryId,
          password: password
        })
      });

      const res = await response.json();


      if (res.success) {
        galleryPassword = password; // Memory only; never in URLs or browser storage.
        galleryImages = Array.isArray(res.images) ? res.images : [];
        document.getElementById('downloadAllBtn').disabled = !galleryImages.length;
        document.getElementById("authGate").style.display = "none";
        document.getElementById("galleryView").style.display = "block";

        document.getElementById("galleryPass").value = "";
        showMsg("success", "");
        if (res.gallery && res.gallery.client_name) {
          document.getElementById("galleryTitle").textContent = res.gallery.client_name;
        }

        if (res.images && res.images.length > 0) {
          renderPhotos(res.images);
        } else {
          document.getElementById("photoGrid").innerHTML = `<p style="grid-column:1/-1; text-align:center;">No images have been added to this gallery yet. Please contact your photographer.</p>`;
        }
      } else {
        showMsg("error", res.error || "Incorrect password or gallery does not exist.");
        btn.disabled = false;
      }
    } catch (err) {
      console.error("Fetch error:", err);
      showMsg("error", "Network error. Please try again later.");
      btn.disabled = false;
    }
  }

  function renderPhotos(images) {
    const grid = document.getElementById("photoGrid");
    grid.innerHTML = "";
    const status = document.getElementById('photoLoadStatus');
    const retry = document.getElementById('retryPhotosBtn');
    const records = [];
    images.forEach(imgObj => {
      const item = document.createElement("div");
      item.className = "gallery-item";
      item.onclick = () => openLightbox(imgObj.url);

      const img = document.createElement("img");

      img.alt = imgObj.filename || "Client gallery image";
      // Grid tiles use the resized thumbnail; the lightbox and the ZIP still use the original.
      records.push({ img, url: imgObj.thumb_url || imgObj.url, name: img.alt, state: 'pending' });
      item.appendChild(img);
      grid.appendChild(item);
    });
    function update() {
      const loaded = records.filter(record => record.state === 'loaded').length;
      const failed = records.filter(record => record.state === 'failed').length;
      const finished = loaded + failed === records.length;
      status.className = 'msg ' + (finished ? (failed ? 'error' : 'success') : 'loading');
      status.textContent = finished
        ? (failed ? `${loaded} of ${records.length} photos loaded. ${failed} could not load. Please retry below.` : `Your gallery is ready — all ${loaded} photos have loaded successfully.`)
        : `Loading your gallery: ${loaded} of ${records.length} photos ready${failed ? `; ${failed} could not load` : ''}. Please keep this page open.`;
      retry.hidden = !finished || !failed;
    }
    async function loadPending() {
      retry.hidden = true;
      const pending = records.filter(record => record.state !== 'loaded');
      pending.forEach(record => { record.state = 'pending'; });
      update();
      let next = 0;
      // Load the whole collection, including photos below the fold, with bounded concurrency.
      await Promise.all(Array.from({ length: Math.min(4, pending.length) }, async () => {
        while (next < pending.length) {
          const record = pending[next++];
          await new Promise(resolve => {
            let settled = false;
            const finish = success => {
              if (settled) return;
              settled = true; clearTimeout(timer);
              record.img.onload = record.img.onerror = null;
              record.state = success ? 'loaded' : 'failed';
              record.img.style.opacity = '1';
              record.img.alt = success ? record.name : `${record.name} — could not load`;
              update(); resolve();
            };
            const timer = setTimeout(() => finish(false), 90000);
            record.img.onload = () => finish(true);
            record.img.onerror = () => finish(false);
            record.img.src = record.url;
          });
        }
      }));
    }
    retry.onclick = loadPending;
    loadPending();
  }

  async function downloadAllPhotos() {
    if (downloadController || !galleryImages.length) return;
    downloadController = new AbortController();
    const button = document.getElementById('downloadAllBtn');
    const cancel = document.getElementById('cancelDownloadBtn');
    const status = document.getElementById('downloadStatus');
    const saveLink = document.getElementById('saveZipLink');
    const nextBtn = document.getElementById('nextPartBtn');
    const startPart = resumePart;
    saveLink.hidden = true; saveLink.removeAttribute('href');
    nextBtn.hidden = true; nextBtn.onclick = null;
    if (readyZipUrl) { URL.revokeObjectURL(readyZipUrl); readyZipUrl = null; }
    button.disabled = true; cancel.hidden = false;
    button.textContent = 'Preparing your ZIP…';
    status.className = 'msg loading';
    status.setAttribute('aria-busy', 'true');
    status.textContent = startPart > 1
      ? `Resuming from part ${startPart}… Keep this page open.`
      : 'Preparing your collection… Keep this page open.';
    try {
      const result = await GalleryDownload.save({ url: APPS_SCRIPT_URL, galleryId, password: galleryPassword,
        images: galleryImages.slice(), signal: downloadController.signal, startPart,
        onProgress: message => { status.textContent = message; },
        onReady: ({ url, filename, part, parts }) => {
          readyZipUrl = url;
          saveLink.href = url; saveLink.download = filename;
          saveLink.textContent = parts > 1 ? `Save part ${part} of ${parts}` : 'Save your ZIP';
          saveLink.hidden = false;
          if (part === parts) return undefined;
          // Only one part is kept in memory: the next one is built after the visitor confirms.
          status.className = 'msg success';
          status.textContent = `Part ${part} of ${parts} is ready. Save it (it may start automatically; otherwise tap “Save part ${part}”), then continue.`;
          nextBtn.textContent = `I’ve saved part ${part} — prepare part ${part + 1} of ${parts}`;
          nextBtn.hidden = false;
          return new Promise(resolve => {
            nextBtn.onclick = () => {
              nextBtn.hidden = true; saveLink.hidden = true;
              if (readyZipUrl) { URL.revokeObjectURL(readyZipUrl); readyZipUrl = null; }
              status.className = 'msg loading';
              status.textContent = `Preparing part ${part + 1} of ${parts}… Keep this page open.`;
              resolve();
            };
          });
        }
      });
      resumePart = 1;
      status.className = 'msg success';
      if (result.savedToDisk) {
        status.textContent = `Download complete — your ZIP has been saved successfully with all ${result.count} original photos. No photos were skipped. Everything is ready; you can close this page.`;
      } else if (result.parts > 1) {
        status.textContent = `All ${result.count} original photos have been delivered across ${result.parts} ZIP files. Check your browser’s Downloads to confirm every part finished saving; if one is missing, use the save link below for the last part, or download again.`;
      } else {
        status.textContent = `Your ZIP is ready — all ${result.count} original photos are included. If the download did not start, tap “Save your ZIP” below. Check your browser’s Downloads for confirmation that the file finished saving.`;
      }
      button.textContent = 'Download ZIP again';
    } catch (error) {
      const aborted = error.name === 'AbortError';
      // Parts already saved are fine: a retry continues from the part that failed.
      resumePart = aborted ? 1 : (error.resumePart || 1);
      if (aborted) {
        saveLink.hidden = true; saveLink.removeAttribute('href');
        if (readyZipUrl) { URL.revokeObjectURL(readyZipUrl); readyZipUrl = null; }
      }
      status.className = aborted ? 'msg loading' : 'msg error';
      status.textContent = aborted
        ? 'Download cancelled. You can start again anytime.'
        : 'Download did not finish: ' + error.message + (resumePart > 1 ? ` ${resumePart === 2 ? 'Part 1 is' : `Parts 1–${resumePart - 1} are`} already saved; retry continues from part ${resumePart}.` : ' Please try again.');
      button.textContent = aborted ? 'Download all photos' : (resumePart > 1 ? `Retry from part ${resumePart}` : 'Retry ZIP download');
    } finally {
      downloadController = null; button.disabled = false; cancel.hidden = true;
      nextBtn.hidden = true; nextBtn.onclick = null;
      status.setAttribute('aria-busy', 'false');
      status.focus({ preventScroll: true });
      status.scrollIntoView({ block: 'nearest' });
    }
  }
  window.addEventListener('beforeunload', event => {
    if (downloadController) { event.preventDefault(); event.returnValue = ''; }
  });

  function showMsg(type, text) {
    const msgDiv = document.getElementById("gateMsg");
    msgDiv.className = "msg " + type;
    msgDiv.textContent = text;
  }

  function openLightbox(url) {
    const lb = document.getElementById("lightbox");
    const lbImg = document.getElementById("lightboxImg");
    lbImg.src = url;
    lb.classList.add("active");
    document.body.style.overflow = "hidden";
  }

  function closeLightbox() {
    document.getElementById("lightbox").classList.remove("active");
    document.body.style.overflow = "";
  }
</script>
</body>
</html>
