<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Studio Control Centre — Diana Obermeyer Photography
  </title>

  <style>

    :root {

      --bg-color: #FAF7F4;
      --card-bg: #FFFFFF;

      --text-main: #2C2C2C;
      --text-muted: #8A8278;

      --accent-gold: #B8976A;

      --border-color:
        rgba(44,44,44,0.08);

    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {

      background:
        var(--bg-color);

      color:
        var(--text-main);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;

      line-height: 1.6;

      padding: 40px 20px;

    }

    .container {

      max-width: 1250px;

      margin: 0 auto;

    }

    header {

      text-align: center;

      margin-bottom: 50px;

      border-bottom:
        1px solid
        var(--border-color);

      padding-bottom: 30px;

    }

    header h1 {

      font-family: Georgia, serif;

      font-size: 32px;

      font-weight: 300;

      letter-spacing: 3px;

      text-transform: uppercase;

    }

    header p {

      font-family: Georgia, serif;

      font-style: italic;

      font-size: 13px;

      letter-spacing: 4px;

      color: var(--accent-gold);

      text-transform: uppercase;

      margin-top: 6px;

    }

    #authGate {

      max-width: 420px;

      margin: 120px auto;

      background: white;

      padding: 45px;

      border:
        1px solid
        var(--border-color);

    }

    label {

      display: block;

      margin-bottom: 8px;

      font-size: 11px;

      letter-spacing: 2px;

      text-transform: uppercase;

      font-weight: 700;

    }

    input,
    select,
    textarea {

      width: 100%;

      padding: 14px;

      margin-bottom: 20px;

      border:
        1px solid
        var(--border-color);

      background: white;

      color: var(--text-main);

      font-size: 14px;

    }

    textarea {
      resize: vertical;
    }

    button {

      background:
        var(--text-main);

      color: white;

      border: none;

      padding: 15px 28px;

      width: 100%;

      cursor: pointer;

      text-transform: uppercase;

      letter-spacing: 2px;

      font-size: 11px;

      transition: .2s ease;

    }

    button:hover {

      background:
        var(--accent-gold);

    }

    button:disabled {

      opacity: .6;

      cursor: not-allowed;

    }

    #dashboard {
      display: none;
    }

    .tabs {

      display: flex;

      gap: 10px;

      margin-bottom: 35px;

      border-bottom:
        1px solid
        var(--border-color);

      padding-bottom: 15px;

    }

    .tab-btn {

      width: auto;

      background: transparent;

      color:
        var(--text-muted);

      padding: 12px 22px;

    }

    .tab-btn.active {

      background:
        var(--text-main);

      color: white;

    }

    .panel {

      display: none;

      background: white;

      padding: 40px;

      border:
        1px solid
        var(--border-color);

    }

    .panel.active {
      display: block;
    }

    h2 {

      font-family: Georgia, serif;

      font-weight: 300;

      font-size: 26px;

      margin-bottom: 30px;

    }

    .stats-grid {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 20px;

      margin-bottom: 35px;

    }

    .stat-card {

      background: white;

      border:
        1px solid
        var(--border-color);

      padding: 30px;

      text-align: center;

    }

    .stat-number {

      display: block;

      font-size: 38px;

      font-weight: 300;

      color:
        var(--accent-gold);

    }

    .stat-label {

      margin-top: 8px;

      font-size: 11px;

      letter-spacing: 2px;

      text-transform: uppercase;

      color:
        var(--text-muted);

    }

    .booking-toolbar {

      display: flex;

      gap: 15px;

      margin-bottom: 25px;

    }

    .booking-toolbar input,
    .booking-toolbar select {

      margin-bottom: 0;

    }

    .booking-table-container {

      overflow-x: auto;

    }

    .booking-table {

      width: 100%;

      border-collapse: collapse;

    }

    .booking-table th {

      text-align: left;

      padding: 15px;

      font-size: 11px;

      letter-spacing: 1px;

      text-transform: uppercase;

      color:
        var(--text-muted);

      border-bottom:
        1px solid
        var(--border-color);

    }

    .booking-table td {

      padding: 18px 15px;

      border-bottom:
        1px solid
        var(--border-color);

      font-size: 14px;

      vertical-align: middle;

    }

    .status-pill {

      padding: 7px 14px;

      border-radius: 999px;

      font-size: 10px;

      font-weight: bold;

      text-transform: uppercase;

      letter-spacing: 1px;

    }

    .booking-status-pending {

      background: #FFF4DD;
      color: #9A6A00;

    }

    .booking-status-confirmed {

      background: #EAF5EA;
      color: #2E662E;

    }

    .booking-status-completed {

      background: #E7F0FF;
      color: #2356A8;

    }

    .booking-status-cancelled {

      background: #FCEAEA;
      color: #9C2A2A;

    }

    .action-btn {

      width: auto;

      background: white;

      color:
        var(--text-main);

      border:
        1px solid
        var(--border-color);

      padding: 10px 16px;

      font-size: 11px;

      letter-spacing: 1px;

    }

    .action-btn:hover {

      background:
        var(--text-main);

      color: white;

    }

    .drop-zone {

      border:
        2px dashed
        var(--border-color);

      padding: 45px 20px;

      text-align: center;

      background: #FAF9F7;

      margin-bottom: 20px;

      cursor: pointer;

      transition: .2s ease;

    }

    .drop-zone.dragover {

      border-color:
        var(--accent-gold);

      background: #F3EFEA;

    }

    .drop-zone p {

      color:
        var(--text-muted);

    }

    .drop-zone span {

      color:
        var(--accent-gold);

      text-decoration: underline;

      font-weight: 700;

    }

    .queue-container {

      display: none;

      margin-bottom: 25px;

    }

    .queue-title {

      margin-bottom: 10px;

      font-size: 11px;

      letter-spacing: 1px;

      text-transform: uppercase;

      font-weight: bold;

    }

    .queue-item {

      display: flex;

      justify-content: space-between;

      align-items: center;

      padding: 12px 15px;

      margin-bottom: 8px;

      background: #FAF9F7;

      border:
        1px solid
        var(--border-color);

    }

    .queue-name {

      font-family: monospace;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;

      max-width: 75%;

    }

    .queue-status {

      font-size: 11px;

      font-weight: bold;

      text-transform: uppercase;

    }

    .status-pending {
      color: var(--text-muted);
    }

    .status-loading {
      color: var(--accent-gold);
    }

    .status-success {
      color: #2E662E;
    }

    .status-error {
      color: #9C2A2A;
    }

    .msg {

      display: none;

      padding: 14px;

      margin-top: 18px;

      font-size: 13px;

    }

    .msg.success {

      display: block;

      background: #EAF5EA;

      color: #2E662E;

    }

    .msg.error {

      display: block;

      background: #FCEAEA;

      color: #9C2A2A;

    }

    .modal-overlay {

      position: fixed;

      inset: 0;

      background:
        rgba(0,0,0,0.6);

      display: none;

      align-items: center;

      justify-content: center;

      z-index: 999;

    }

    .modal-overlay.active {

      display: flex;

    }

    .modal {

      background: white;

      width: 95%;

      max-width: 720px;

      padding: 40px;

      max-height: 90vh;

      overflow-y: auto;

      animation:
        modalFade .25s ease;

    }

    @keyframes modalFade {

      from {

        opacity: 0;

        transform:
          translateY(10px);

      }

      to {

        opacity: 1;

        transform:
          translateY(0);

      }

    }

    .modal-header {

      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 30px;

    }

    .close-modal {

      width: auto;

      background: transparent;

      color:
        var(--text-muted);

      font-size: 28px;

      padding: 0;

    }

    @media(max-width:768px) {

      .stats-grid {

        grid-template-columns: 1fr;

      }

      .booking-toolbar {

        flex-direction: column;

      }

      .tabs {

        flex-direction: column;

      }

    }

  </style>
</head>

<body>

<div class="container">

<header>

  <h1>Diana Obermeyer</h1>

  <p>Studio Control Centre</p>

</header>

<div id="authGate">

  <label for="gateToken">
    Enter Private Dashboard Password
  </label>

  <input
    type="password"
    id="gateToken"
    placeholder="••••••••••••"
  >

  <button
    id="loginBtn"
    onclick="attemptLogin()"
  >
    Verify Password
  </button>

  <div
    id="gateMsg"
    class="msg"
  ></div>

</div>

<div id="dashboard">

  <div class="tabs">

    <button
      class="tab-btn active"
      onclick="switchTab('bookingsPanel', this)"
    >
      Manage Bookings
    </button>

    <button
      class="tab-btn"
      onclick="switchTab('galleryPanel', this)"
    >
      Portfolio Manager
    </button>

    <button
      class="tab-btn"
      onclick="switchTab('clientPanel', this)"
    >
      Client Deliveries
    </button>

  </div>

  <div
    id="bookingsPanel"
    class="panel active"
  >

    <h2>Studio Booking Management</h2>

    <div class="stats-grid">

      <div class="stat-card">

        <span
          class="stat-number"
          id="pendingCount"
        >
          0
        </span>

        <span class="stat-label">
          Pending
        </span>

      </div>

      <div class="stat-card">

        <span
          class="stat-number"
          id="confirmedCount"
        >
          0
        </span>

        <span class="stat-label">
          Confirmed
        </span>

      </div>

      <div class="stat-card">

        <span
          class="stat-number"
          id="completedCount"
        >
          0
        </span>

        <span class="stat-label">
          Completed
        </span>

      </div>

    </div>

    <div class="booking-toolbar">

      <input
        type="text"
        id="bookingSearch"
        placeholder="Search client, email, booking ID..."
      >

      <select id="statusFilter">

        <option value="all">
          All Statuses
        </option>

        <option value="Pending">
          Pending
        </option>

        <option value="Confirmed">
          Confirmed
        </option>

        <option value="Completed">
          Completed
        </option>

        <option value="Cancelled">
          Cancelled
        </option>

      </select>

    </div>

    <div class="booking-table-container">

      <table class="booking-table">

        <thead>

          <tr>

            <th>Client</th>

            <th>Session</th>

            <th>Date</th>

            <th>Status</th>

            <th>Actions</th>

          </tr>

        </thead>

        <tbody id="bookingTableBody"></tbody>

      </table>

    </div>

    <div
      id="bookingMsg"
      class="msg"
    ></div>

  </div>

</div>

</div>

<div
  class="modal-overlay"
  id="bookingModal"
>

  <div class="modal">

    <div class="modal-header">

      <h2>Booking Details</h2>

      <button
        class="close-modal"
        onclick="closeBookingModal()"
      >
        ×
      </button>

    </div>

    <div id="modalContent"></div>

  </div>

</div>

<script>

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbx8lZm_M1DR4NZS_Y5ZabKwFEGi5Cwbu2FNeZnhM5_LdLX9AjMEUm7Pjz79J8IigPxc/exec";

let adminToken = "";

let allBookings = [];

async function attemptLogin() {

  const tokenInput =
    document.getElementById("gateToken")
    .value
    .trim();

  const msgDiv =
    document.getElementById("gateMsg");

  const loginBtn =
    document.getElementById("loginBtn");

  if (!tokenInput) {

    showMsg(
      msgDiv,
      "error",
      "Password field cannot be blank."
    );

    return;

  }

  showMsg(
    msgDiv,
    "success",
    "Verifying authorization token..."
  );

  loginBtn.disabled = true;

  try {

    const response = await fetch(

      GOOGLE_SCRIPT_URL,

      {
        method: "POST",

        mode: "cors",

        headers: {
          "Content-Type":
          "text/plain;charset=utf-8"
        },

        body: JSON.stringify({

          action: "admin_verify",

          token: tokenInput

        })

      }

    );

    const res = await response.json();

    if (res.success) {

      adminToken = tokenInput;

      document.getElementById("authGate")
      .style.display = "none";

      document.getElementById("dashboard")
      .style.display = "block";

      loadBookings();

    } else {

      showMsg(
        msgDiv,
        "error",
        res.error ||
        "Access Denied."
      );

      loginBtn.disabled = false;

    }

  } catch(err) {

    showMsg(
      msgDiv,
      "error",
      "Connection failed."
    );

    loginBtn.disabled = false;

  }

}

document
.getElementById("gateToken")
.addEventListener("keypress", (e) => {

  if (e.key === "Enter") {

    attemptLogin();

  }

});

function switchTab(panelId, btn) {

  document
  .querySelectorAll(".panel")
  .forEach(p =>
    p.classList.remove("active")
  );

  document
  .querySelectorAll(".tab-btn")
  .forEach(b =>
    b.classList.remove("active")
  );

  document
  .getElementById(panelId)
  .classList.add("active");

  btn.classList.add("active");

}

async function loadBookings() {

  const tbody =
    document.getElementById(
      "bookingTableBody"
    );

  tbody.innerHTML = `

    <tr>

      <td
        colspan="5"
        style="
          padding:40px;
          text-align:center;
          color:var(--text-muted);
        "
      >

        Loading bookings...

      </td>

    </tr>

  `;

  try {

    const response = await fetch(

      `${GOOGLE_SCRIPT_URL}?action=admin_fetch_all&token=${adminToken}`

    );

    const data = await response.json();

    if (data.success) {

      allBookings =
        data.bookings || [];

      renderBookings(allBookings);

      updateStats(allBookings);

    }

  } catch(err) {

    tbody.innerHTML = `

      <tr>

        <td
          colspan="5"
          style="
            padding:40px;
            text-align:center;
            color:#9C2A2A;
          "
        >

          Failed to load bookings.

        </td>

      </tr>

    `;

  }

}

function renderBookings(bookings) {

  const tbody =
    document.getElementById(
      "bookingTableBody"
    );

  tbody.innerHTML = "";

  bookings.forEach(booking => {

    const tr =
      document.createElement("tr");

    tr.innerHTML = `

      <td>

        <strong>
          ${booking.name}
        </strong>

        <br>

        <span
          style="
            color:var(--text-muted);
            font-size:12px;
          "
        >

          ${booking.email}

        </span>

      </td>

      <td>
        ${booking.session_type}
      </td>

      <td>
        ${booking.preferred_date}
      </td>

      <td>

        <span
          class="
            status-pill
            booking-status-${booking.status.toLowerCase()}
          "
        >

          ${booking.status}

        </span>

      </td>

      <td>

        <button
          class="action-btn"
          onclick="
            openBookingModalById(
              '${booking.booking_id}'
            )
          "
        >

          View

        </button>

      </td>

    `;

    tbody.appendChild(tr);

  });

}

function updateStats(bookings) {

  document.getElementById("pendingCount")
  .textContent =

    bookings.filter(
      b => b.status === "Pending"
    ).length;

  document.getElementById("confirmedCount")
  .textContent =

    bookings.filter(
      b => b.status === "Confirmed"
    ).length;

  document.getElementById("completedCount")
  .textContent =

    bookings.filter(
      b => b.status === "Completed"
    ).length;

}

document
.getElementById("bookingSearch")
.addEventListener("input", filterBookings);

document
.getElementById("statusFilter")
.addEventListener("change", filterBookings);

function filterBookings() {

  const search =
    document
    .getElementById("bookingSearch")
    .value
    .toLowerCase();

  const status =
    document
    .getElementById("statusFilter")
    .value;

  const filtered =
    allBookings.filter(booking => {

      const matchesSearch =

        booking.name
        .toLowerCase()
        .includes(search)

        ||

        booking.email
        .toLowerCase()
        .includes(search)

        ||

        booking.booking_id
        .toLowerCase()
        .includes(search);

      const matchesStatus =

        status === "all"

        ||

        booking.status === status;

      return (
        matchesSearch &&
        matchesStatus
      );

    });

  renderBookings(filtered);

}

function openBookingModalById(id) {

  const booking =
    allBookings.find(
      b => b.booking_id === id
    );

  openBookingModal(booking);

}

function openBookingModal(booking) {

  document
  .getElementById("bookingModal")
  .classList.add("active");

  document
  .getElementById("modalContent")
  .innerHTML = `

    <div style="margin-bottom:20px;">

      <strong>Booking ID:</strong>

      ${booking.booking_id}

    </div>

    <div style="margin-bottom:20px;">

      <strong>Client:</strong>

      ${booking.name}

    </div>

    <div style="margin-bottom:20px;">

      <strong>Email:</strong>

      ${booking.email}

    </div>

    <div style="margin-bottom:20px;">

      <strong>Phone:</strong>

      ${booking.phone || "N/A"}

    </div>

    <div style="margin-bottom:20px;">

      <strong>Session:</strong>

      ${booking.session_type}

    </div>

    <div style="margin-bottom:20px;">

      <strong>Date:</strong>

      ${booking.preferred_date}

    </div>

    <div style="margin-bottom:20px;">

      <strong>Location:</strong>

      ${booking.location || "N/A"}

    </div>

    <div style="margin-bottom:25px;">

      <strong>Client Message:</strong>

      <div
        style="
          margin-top:10px;
          padding:20px;
          background:#FAF9F7;
          border:1px solid var(--border-color);
        "
      >

        ${booking.message || "No message provided."}

      </div>

    </div>

    <label>Status</label>

    <select id="modalStatus">

      <option value="Pending">
        Pending
      </option>

      <option value="Confirmed">
        Confirmed
      </option>

      <option value="Completed">
        Completed
      </option>

      <option value="Cancelled">
        Cancelled
      </option>

    </select>

    <label>Private Notes</label>

    <textarea
      id="modalNotes"
      rows="5"
    >${booking.notes || ""}</textarea>

    <button
      onclick="
        updateBooking(
          '${booking.booking_id}'
        )
      "
    >

      Save Changes

    </button>

  `;

  document
  .getElementById("modalStatus")
  .value = booking.status;

}

function closeBookingModal() {

  document
  .getElementById("bookingModal")
  .classList.remove("active");

}

async function updateBooking(bookingId) {

  const payload = {

    action:
      "admin_update_booking",

    token:
      adminToken,

    booking_id:
      bookingId,

    status:
      document
      .getElementById("modalStatus")
      .value,

    notes:
      document
      .getElementById("modalNotes")
      .value

  };

  try {

    const response = await fetch(

      GOOGLE_SCRIPT_URL,

      {

        method: "POST",

        mode: "cors",

        headers: {

          "Content-Type":
          "text/plain;charset=utf-8"

        },

        body: JSON.stringify(payload)

      }

    );

    const res =
      await response.json();

    if (res.success) {

      closeBookingModal();

      showMsg(

        document.getElementById(
          "bookingMsg"
        ),

        "success",

        "Booking updated successfully."

      );

      await loadBookings();

    } else {

      showMsg(

        document.getElementById(
          "bookingMsg"
        ),

        "error",

        res.error ||
        "Update failed."

      );

    }

  } catch(err) {

    showMsg(

      document.getElementById(
        "bookingMsg"
      ),

      "error",

      "Network request failed."

    );

  }

}

function showMsg(
  element,
  type,
  text
) {

  element.className =
    "msg " + type;

  element.textContent =
    text;

}

</script>

</body>
</html>
